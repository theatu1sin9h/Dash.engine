name: tests and dependency audit

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
      QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xkb1
      - name: Install application and audit tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . build pip-audit pip-licenses
      - name: Verify SPDX headers
        run: |
          python - <<'PY'
          from pathlib import Path

          expected = [
              "# SPDX-License-Identifier: GPL-3.0-or-later",
              "# Copyright (C) 2026 Atul Singh Chandel",
          ]
          ignored = {".git", ".venv", "__pycache__", "build", "dist"}
          missing = []
          for path in sorted(Path(".").rglob("*.py")):
              if ignored.intersection(path.parts):
                  continue
              if path.read_text(encoding="utf-8").splitlines()[:2] != expected:
                  missing.append(str(path))
          if missing:
              print("Missing or incorrect license headers:")
              print("\n".join(missing))
              raise SystemExit(1)
          PY
      - name: Check installed dependency licenses
        run: >-
          pip-licenses --allow-only
          "Apache Software License;Apache-2.0;Apache-2.0 OR BSD-2-Clause;BSD License;BSD-2-Clause;BSD-3-Clause;GPL-3.0-only;GPL-3.0-or-later;ISC;ISC License;LGPL v3;LGPL-3.0-only;LGPL-3.0-or-later;MIT;MIT License;MPL-2.0;Mozilla Public License 2.0 (MPL 2.0);PSF-2.0;Python Software Foundation License;Unlicense"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Compile-check
        run: python -m compileall -q browser tests main.py
      - name: Audit pinned direct dependency set
        run: pip-audit --strict -r requirements-audit.txt
      - name: Build source distribution and wheel
        run: python -m build
